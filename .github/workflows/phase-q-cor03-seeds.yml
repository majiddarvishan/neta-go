name: Phase Q — Q-COR-03 seed replay and bounded fuzz campaign

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/wire/wire_fuzz_test.go'
      - 'scripts/phase-q-cor03-seed-check.sh'
      - 'scripts/phase-q-cor03-fuzz-campaign.sh'
      - '.github/workflows/phase-q-cor03-seeds.yml'
  push:
    branches: [main, qual/q-cor03-seed-replay-2026-11-22, qual/phase-q-software-harnesses-2026-11-22]
    paths:
      - 'internal/wire/wire_fuzz_test.go'
      - 'scripts/phase-q-cor03-seed-check.sh'
      - 'scripts/phase-q-cor03-fuzz-campaign.sh'
      - '.github/workflows/phase-q-cor03-seeds.yml'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Per-target fuzz time; default 1s smoke. Longer campaigns require separate owner approval.'
        required: true
        default: '1s'
        type: string

permissions:
  contents: read

jobs:
  seed-replay:
    name: Q-COR-03 deterministic seeds and bounded parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Replay deterministic embedded seeds
        run: bash scripts/phase-q-cor03-seed-check.sh "$RUNNER_TEMP/qcor03-seed-evidence"

      - name: Run bounded parser fuzz campaign
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '1s' }}
          FUZZ_PARALLEL: '2'
          FUZZ_TARGET_TIMEOUT: '10m'
        run: bash scripts/phase-q-cor03-fuzz-campaign.sh "$RUNNER_TEMP/qcor03-fuzz-evidence"

      - name: Upload fuzz campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcor03-fuzz-campaign-evidence
          path: ${{ runner.temp }}/qcor03-fuzz-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload seed replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcor03-seed-replay-evidence
          path: ${{ runner.temp }}/qcor03-seed-evidence
          if-no-files-found: warn
          retention-days: 30
